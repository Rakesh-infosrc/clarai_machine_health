bundle:
  name: clarai_machine_health

include:
  - resources/*.yml

targets:
  dev:
    default: true
  prod:
    mode: production
    workspace:
      root_path: /Workspace/.bundle/${bundle.name}/${bundle.target}

variables:
  catalog:
    description: Unity Catalog name
    default: machine_health
  prod_schema:
    description: Production schema
    default: prod
  dev_schema:
    description: Development schema
    default: dev